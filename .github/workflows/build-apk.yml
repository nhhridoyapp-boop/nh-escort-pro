name: Build EscortPro APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Project files
        run: |
          mkdir -p www
          cat > www/index.html <<'EOF'
          <!doctype html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>EscortPro</title><body style="background:#0a1120;color:#e2e8f0;font-family:sans-serif;text-align:center;padding:40px">
          <h3>EscortPro</h3><script>location.href='https://nh-escort-pro.web.app'</script></body></html>
          EOF
          cat > package.json <<'EOF'
          {
            "name": "escortpro-android",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "6.1.2",
              "@capacitor/cli": "6.1.2",
              "@capacitor/core": "6.1.2"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.sanmarine.escortpro",
            "appName": "EscortPro",
            "webDir": "www",
            "server": {
              "url": "https://nh-escort-pro.web.app",
              "cleartext": false,
              "androidScheme": "https",
              "allowNavigation": ["nh-escort-pro.web.app", "escort-manager-pro.firebaseapp.com", "*.googleapis.com", "*.gstatic.com"]
            },
            "android": { "allowMixedContent": false, "backgroundColor": "#0a1120" }
          }
          EOF
      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - run: npx cap sync android
      - name: SMSI icon (failure never breaks build)
        continue-on-error: true
        run: |
          pip install pillow --break-system-packages -q || pip install pillow -q
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import glob, os
          F='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          sizes={'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for n,z in sizes.items():
              d='android/app/src/main/res/mipmap-'+n
              if not os.path.isdir(d): continue
              im=Image.new('RGB',(z,z))
              dr=ImageDraw.Draw(im)
              for y in range(z):
                  t=y/z; dr.line([(0,y),(z,y)],fill=(int(7+20*t),int(13+25*t),int(31+60*t)))
              f=ImageFont.truetype(F,int(z*.27))
              w=dr.textlength('SMSI',font=f); dr.text(((z-w)/2,z*.22),'SMSI',font=f,fill=(250,204,21))
              f2=ImageFont.truetype(F,int(z*.13))
              w2=dr.textlength('NH',font=f2); dr.text(((z-w2)/2,z*.6),'NH',font=f2,fill=(245,158,11))
              for name in ('ic_launcher.png','ic_launcher_round.png','ic_launcher_foreground.png'):
                  im.save(d+'/'+name)
          PY
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk EscortPro.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EscortPro-apk
          path: EscortPro.apk
