name: Build EscortPro APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Project files
        run: |
          mkdir -p www
          cat > www/index.html <<'EOF'
          <!doctype html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>EscortPro</title><body style="background:#0a1120;color:#e2e8f0;font-family:sans-serif;text-align:center;padding:40px">
          <h3>EscortPro</h3><script>location.href='https://nh-escort-pro.web.app'</script></body></html>
          EOF
          cat > package.json <<'EOF'
          {
            "name": "escortpro-android",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "6.1.2",
              "@capacitor/cli": "6.1.2",
              "@capacitor/core": "6.1.2"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.sanmarine.escortpro",
            "appName": "EscortPro",
            "webDir": "www",
            "server": {
              "url": "https://nh-escort-pro.web.app",
              "cleartext": false,
              "androidScheme": "https",
              "allowNavigation": ["nh-escort-pro.web.app", "escort-manager-pro.firebaseapp.com", "*.googleapis.com", "*.gstatic.com"]
            },
            "android": { "allowMixedContent": false, "backgroundColor": "#0a1120" }
          }
          EOF
      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - run: npx cap sync android
      - name: SMSI icon
        run: |
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; z=${d##*:}
            convert -size ${z}x${z} gradient:'#070d1f-#1b2a5c' -gravity center -font DejaVu-Sans-Bold -fill '#facc15' -pointsize $((z*30/100)) -annotate +0-$((z*7/100)) 'SMSI' -fill '#f59e0b' -pointsize $((z*13/100)) -annotate +0+$((z*20/100)) 'NH' android/app/src/main/res/mipmap-$n/ic_launcher.png
            cp android/app/src/main/res/mipmap-$n/ic_launcher.png android/app/src/main/res/mipmap-$n/ic_launcher_round.png
            cp android/app/src/main/res/mipmap-$n/ic_launcher.png android/app/src/main/res/mipmap-$n/ic_launcher_foreground.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk EscortPro.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EscortPro-apk
          path: EscortPro.apk
